plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.sillage'
version = '0.1.0'

android {
  namespace "expo.modules.sillagedevice"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Même version que react-native-health-connect 4.1.3 : Gradle n'en garde qu'une.
  implementation "androidx.health.connect:connect-client:1.1.0"
}
